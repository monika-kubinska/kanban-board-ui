<header class="site-header">
  <a class="brand" routerLink="/">Kanban Board</a>

  <nav class="account-nav" aria-label="Konto">
    @if (isAuthenticated()) {
      <a class="user-name" routerLink="/account">
        {{ userName() || 'Użytkownik' }}
        @if (userEmail()) {
          <small>{{ userEmail() }}</small>
        }
      </a>
      <button type="button" (click)="logout()">Wyloguj</button>
    } @else {
      <a routerLink="/login">Zaloguj</a>
      <a routerLink="/register">Zarejestruj</a>
    }
  </nav>
</header>
