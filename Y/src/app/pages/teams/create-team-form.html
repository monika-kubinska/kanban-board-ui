<form (submit)="submit($event)">
  <label for="team-name">{{ t('teams') }}</label>
  <div class="form-row">
    <input
      id="team-name"
      name="teamName"
      type="text"
      [(ngModel)]="teamName"
      maxlength="100"
      required
    />
    <button type="submit" [disabled]="loading() || !teamName.trim()">
      {{ loading() ? t('creating') : t('createTeam') }}
    </button>
  </div>
</form>
@if (error()) {
  <p class="message error">{{ error() }}</p>
}
