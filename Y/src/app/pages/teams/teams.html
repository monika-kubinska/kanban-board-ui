<section class="teams-page" aria-labelledby="teams-title">
  <div class="page-heading">
    <div>
      <p class="eyebrow">{{ t('teams') }}</p>
      <h1 id="teams-title">{{ t('teams') }}</h1>
      <p class="intro">{{ t('teamsIntro') }}</p>
    </div>
    <span class="team-count">{{ teams().length }}</span>
  </div>

  <section class="create-panel" aria-labelledby="create-team-title">
    <div>
      <h2 id="create-team-title">{{ t('createTeam') }}</h2>
      <p>{{ t('teamIntro') }}</p>
    </div>
    <app-create-team-form
      [loading]="creating()"
      [error]="createError()"
      (create)="createTeam($event)"
    />
  </section>

  <app-team-list
    [teams]="teams()"
    [users]="users()"
    [canManageMembers]="canManageMembers()"
    [loading]="loading()"
    [error]="error()"
    [expandedTeams]="expandedTeams()"
    [removingMember]="removingMember()"
    [addingMember]="addingMember()"
    [memberError]="memberError()"
    (toggle)="toggleTeam($event)"
    (addMember)="addMember($event)"
    (removeMember)="removeMember($event)"
  />
</section>
